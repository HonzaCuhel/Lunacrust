name: Desktop build and verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            executable: dist/mac-arm64/Lunacrust.app
          - runner: macos-15-intel
            platform: mac
            arch: x64
            executable: dist/mac/Lunacrust.app
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            executable: dist/linux-unpacked/lunacrust
          - runner: windows-2025
            platform: win
            arch: x64
            executable: dist/win-unpacked/Lunacrust.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package native installers (unsigned, no publishing)
        run: npm run dist:${{ matrix.platform }} -- --${{ matrix.arch }}
      - name: Verify package matches checked-out source
        run: node tools/verify-package-source.js "${{ matrix.executable }}"
      - name: Verify packaged application (native Apple Silicon)
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        run: node tools/verify-bundle.js "${{ matrix.executable }}"
      - name: Install Debian package
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ./dist/Lunacrust-*-linux-amd64.deb
      - name: Verify installed application (Linux with virtual display)
        if: runner.os == 'Linux'
        env:
          LUNACRUST_SOFTWARE_RENDERING: '1'
        run: |
          node tools/verify-package-source.js /opt/Lunacrust/lunacrust
          xvfb-run --auto-servernum node tools/verify-bundle.js /opt/Lunacrust/lunacrust
      - name: Install and verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LUNACRUST_SOFTWARE_RENDERING: '1'
        run: |
          $installer = @(Get-ChildItem dist/Lunacrust-*-win-x64-unsigned.exe)
          if ($installer.Count -ne 1) { throw "Expected one Windows installer" }
          $installDir = Join-Path $env:RUNNER_TEMP "Lunacrust-installed"
          $installProcess = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Installer exited with $($installProcess.ExitCode)" }
          $installedExecutable = Join-Path $installDir "Lunacrust.exe"
          if (!(Test-Path $installedExecutable)) { throw "Installer did not create $installedExecutable" }
          node tools/verify-package-source.js "$installedExecutable"
          if ($LASTEXITCODE -ne 0) { throw "Installed source verification failed" }
          node tools/verify-bundle.js "$installedExecutable"
          if ($LASTEXITCODE -ne 0) { throw "Installed runtime verification failed" }
      - name: Export source
        if: runner.os == 'Linux'
        run: npm run source:archive
      - run: npm run checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lunacrust-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Lunacrust-*.dmg
            dist/Lunacrust-*.zip
            dist/Lunacrust-*.exe
            dist/Lunacrust-*.AppImage
            dist/Lunacrust-*.deb
            dist/Lunacrust-*-source.tar.gz
            dist/SHA256SUMS.txt
  intel-runtime:
    name: Intel macOS runtime (Rosetta on Apple Silicon)
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Lunacrust-mac-x64
          path: dist-intel
      - name: Verify downloaded installer integrity
        working-directory: dist-intel
        run: shasum -a 256 -c SHA256SUMS.txt
      - name: Ensure Rosetta is available
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
      # The hosted Intel VM failed to create WebGL2. Test the original ZIP via
      # Rosetta, without adding a Vulkan loader or disabling Chromium's sandbox.
      # This verifies translation compatibility, not a physical Intel GPU.
      - name: Verify original Intel application through Rosetta
        run: |
          ditto -x -k dist-intel/Lunacrust-*-mac-x64-unsigned.zip "$RUNNER_TEMP/lunacrust-intel"
          node tools/verify-package-source.js "$RUNNER_TEMP/lunacrust-intel/Lunacrust.app"
          node tools/verify-bundle.js "$RUNNER_TEMP/lunacrust-intel/Lunacrust.app"
