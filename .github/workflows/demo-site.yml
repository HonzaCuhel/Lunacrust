name: Demo site verification
on:
  workflow_dispatch:
  pull_request:
    paths: ['site/**', 'app/**', 'tools/build-site.mjs', 'tools/serve-site.mjs', 'tools/check-site.mjs', '.github/workflows/demo-site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'app/**', 'tools/build-site.mjs', 'tools/serve-site.mjs', 'tools/check-site.mjs', '.github/workflows/demo-site.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/build-site.mjs
      - name: Check website and playable demo
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          node tools/serve-site.mjs > /tmp/lunacrust-site.log 2>&1 &
          node tools/check-site.mjs
